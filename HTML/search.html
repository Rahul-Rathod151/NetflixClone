<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Search - Netflix</title>
     <link rel="icon" href="https://assets.nflxext.com/us/ffe/siteui/common/icons/nficon2016.ico">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        crossorigin="anonymous"
        referrerpolicy="no-referrer"
    >

    <link rel="stylesheet" href="/css/search.css">
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="search-header">

        <a href="browse.html" class="netflix-logo">
            NETFLIX
        </a>

        <a href="browse.html" class="back-button">
            <i class="fa-solid fa-arrow-left"></i>
            Browse
        </a>

    </header>


    <!-- ================= SEARCH ================= -->

    <main class="search-page">

        <div class="search-box">

            <i class="fa-solid fa-magnifying-glass"></i>

            <input
                type="text"
                id="search-input"
                placeholder="Search for movies, shows and more..."
                autocomplete="off"
            >

            <button
                id="clear-search"
                aria-label="Clear search"
            >
                <i class="fa-solid fa-xmark"></i>
            </button>

        </div>


        <!-- ================= SEARCH INFO ================= -->

        <div class="search-heading">

            <h1 id="search-title">
                Explore Movies & Shows
            </h1>

            <p id="result-count"></p>

        </div>


        <!-- ================= RESULTS ================= -->

        <section
            class="search-results"
            id="search-results"
        ></section>


        <!-- ================= EMPTY STATE ================= -->

        <div
            class="empty-state"
            id="empty-state"
        >

            <i class="fa-solid fa-film"></i>

            <h2>
                Find your next favorite
            </h2>

            <p>
                Search for movies, shows, genres or titles.
            </p>

        </div>


        <!-- ================= NO RESULTS ================= -->

        <div
            class="no-results"
            id="no-results"
        >

            <i class="fa-solid fa-face-frown"></i>

            <h2>
                No results found
            </h2>

            <p>
                Try searching for another movie or show.
            </p>

        </div>

    </main>


    <!-- ================= SCRIPT ================= -->

    <script src="/javascript/movies.js"></script>
    <script src="/javascript/search.js"></script>

</body>

</html>
