<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - Netflix</title>

     <link rel="icon" href="https://assets.nflxext.com/us/ffe/siteui/common/icons/nficon2016.ico">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer"
    >

    <!-- CSS -->
    <link rel="stylesheet" href="/css/forgot-password.css">
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="forgot-header">

        <a href="index.html" class="netflix-logo">
            NETFLIX
        </a>

        <a href="login.html" class="signin-link">
            Sign In
        </a>

    </header>


    <!-- ================= MAIN ================= -->

    <main class="forgot-page">

        <div class="forgot-container">

            <div class="forgot-box">

                <!-- Icon -->

                <div class="forgot-icon">
                    <i class="fa-solid fa-lock"></i>
                </div>


                <h1>Forgot Password</h1>


                <p class="forgot-description">
                    Enter the email address associated with your
                    account and we'll send you a link to reset
                    your password.
                </p>


                <!-- ================= FORM ================= -->

                <form id="forgot-form">

                    <div class="input-group">

                        <input
                            type="email"
                            id="email"
                            placeholder=" "
                            autocomplete="email"
                        >

                        <label for="email">
                            Email address
                        </label>

                        <small
                            class="error-message"
                            id="email-error">
                        </small>

                    </div>


                    <!-- Submit -->

                    <button
                        type="submit"
                        class="reset-button"
                    >
                        Send Reset Link
                    </button>


                    <!-- Back to Login -->

                    <a
                        href="login.html"
                        class="back-login"
                    >
                        <i class="fa-solid fa-arrow-left"></i>
                        Back to Sign In
                    </a>


                    <!-- Message -->

                    <div
                        class="reset-message"
                        id="reset-message">
                    </div>

                </form>

            </div>

        </div>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer class="forgot-footer">

        <p>
            Questions? Call
            <a href="#">000-800-919-1694</a>
        </p>

        <div class="footer-links">

            <a href="#">FAQ</a>
            <a href="#">Help Centre</a>
            <a href="#">Terms of Use</a>
            <a href="#">Privacy</a>

        </div>

    </footer>


    <!-- JavaScript -->

    <script type="module" src="../javascript/forgot-password.js"></script>

</body>

</html>
