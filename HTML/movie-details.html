<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Details - Netflix</title>

    <link rel="icon" href="https://assets.nflxext.com/us/ffe/siteui/common/icons/nficon2016.ico">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="../css/movie-details.css">
</head>

<body>

    <!-- ================= NAVBAR ================= -->
    <header class="details-header">
        <a href="browse.html" class="netflix-logo" aria-label="Netflix Home">
            NETFLIX
        </a>

        <div class="header-actions">
            <a href="search.html" class="icon-link" aria-label="Search">
                <i class="fa-solid fa-magnifying-glass"></i>
            </a>
            <a href="browse.html" class="back-button">
                <i class="fa-solid fa-arrow-left"></i>
                <span>Back to Browse</span>
            </a>
        </div>
    </header>

    <!-- ================= HERO ================= -->
    <main>
        <section class="movie-details-hero">
            <div class="details-background">
                <img id="background-image" src="" alt="Movie Backdrop">
            </div>

            <div class="details-gradient"></div>

            <div class="details-content">
                <div class="details-info">
                    <p class="netflix-series">
                        <i class="fa-solid fa-n" style="color:#e50914;"></i> FILM / SERIES
                    </p>

                    <h1 id="movie-title">Movie Title</h1>

                    <div class="movie-meta">
                        <span id="movie-score" style="color:#46d369; font-weight:700;">8.5 Match</span>
                        <span id="movie-year">2025</span>
                        <span class="badge-rating" id="movie-rating">16+</span>
                        <span class="badge-quality" id="movie-quality">4K Ultra HD</span>
                        <span id="movie-seasons">1 Season</span>
                        <span id="movie-genre">Drama</span>
                    </div>

                    <p class="movie-description" id="movie-description">
                        Movie description goes here.
                    </p>

                    <div class="details-buttons">
                        <button class="play-button" id="play-button">
                            <i class="fa-solid fa-play"></i>
                            Play Now
                        </button>

                        <button class="list-button" id="list-button">
                            <i class="fa-solid fa-plus"></i>
                            <span>Add to My List</span>
                        </button>

                        <button class="icon-action-btn" id="like-button" aria-label="Like">
                            <i class="fa-regular fa-thumbs-up"></i>
                        </button>
                    </div>

                    <div class="movie-cast-info">
                        <p><strong>Cast:</strong> <span id="movie-cast">Loading cast...</span></p>
                        <p><strong>Director:</strong> <span id="movie-director">Loading director...</span></p>
                    </div>
                </div>
            </div>
        </section>

        <!-- ================= TRAILER ================= -->
        <section class="trailer-section">
            <div class="section-title">
                <h2>Official Trailer</h2>
            </div>
            <div class="video-wrapper">
                <div class="youtube-player" id="youtube-player"></div>
            </div>
        </section>

        <!-- ================= MORE LIKE THIS ================= -->
        <section class="related-section">
            <div class="section-title">
                <h2>More Like This</h2>
            </div>
            <div class="related-movies" id="related-movies"></div>
        </section>
    </main>

    <!-- JAVASCRIPT -->
    <script src="../javascript/movies.js"></script>
    <script src="../javascript/movie-details.js"></script>

</body>

</html>
