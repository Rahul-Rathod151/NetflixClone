<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watching - Netflix</title>

    <link rel="icon" href="https://assets.nflxext.com/us/ffe/siteui/common/icons/nficon2016.ico">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="../css/watch.css">
</head>

<body>

    <div class="watch-container" id="watch-container">

        <!-- TOP NAVIGATION OVERLAY -->
        <header class="watch-header" id="watch-header">
            <button class="btn-watch-back" id="watch-back-btn" aria-label="Back to browse">
                <i class="fa-solid fa-arrow-left"></i>
            </button>
            <div class="watch-title-info">
                <h2 id="watch-movie-title">Loading Title...</h2>
                <span id="watch-movie-sub">Netflix Original</span>
            </div>
            <div class="watch-header-right">
                <button class="watch-icon-btn" id="flag-btn" title="Report issue">
                    <i class="fa-regular fa-flag"></i>
                </button>
            </div>
        </header>

        <!-- VIDEO PLAYER FRAME -->
        <div class="video-viewport">
            <div id="player-iframe-container" class="player-iframe-container"></div>
            
            <!-- CONTROLS OVERLAY -->
            <div class="watch-controls-overlay" id="controls-overlay">
                
                <!-- Center Big Play Button (shows on pause) -->
                <button class="big-play-btn" id="big-play-btn" style="display:none;">
                    <i class="fa-solid fa-play"></i>
                </button>

                <!-- BOTTOM CONTROLS BAR -->
                <div class="controls-bar">
                    
                    <!-- SEEK SLIDER -->
                    <div class="seek-container">
                        <input type="range" id="seek-bar" min="0" max="100" value="35" class="seek-slider">
                        <div class="seek-progress" id="seek-progress" style="width: 35%;"></div>
                    </div>

                    <div class="controls-row">
                        <div class="controls-left">
                            <button class="ctrl-btn" id="play-pause-btn" title="Play/Pause">
                                <i class="fa-solid fa-pause"></i>
                            </button>

                            <button class="ctrl-btn" id="rewind-btn" title="Rewind 10 seconds">
                                <i class="fa-solid fa-rotate-left"></i>
                            </button>

                            <button class="ctrl-btn" id="forward-btn" title="Forward 10 seconds">
                                <i class="fa-solid fa-rotate-right"></i>
                            </button>

                            <div class="volume-container">
                                <button class="ctrl-btn" id="volume-btn" title="Mute/Unmute">
                                    <i class="fa-solid fa-volume-high"></i>
                                </button>
                                <input type="range" id="volume-slider" min="0" max="100" value="80" class="volume-slider">
                            </div>

                            <span class="time-display" id="time-display">24:18 / 1:45:00</span>
                        </div>

                        <div class="controls-right">
                            <div class="speed-selector-wrapper">
                                <button class="ctrl-btn" id="speed-btn" title="Playback Speed">
                                    <span id="current-speed">1x</span>
                                </button>
                                <div class="speed-menu" id="speed-menu">
                                    <span data-speed="0.5">0.5x</span>
                                    <span data-speed="1" class="active">1x</span>
                                    <span data-speed="1.25">1.25x</span>
                                    <span data-speed="1.5">1.5x</span>
                                    <span data-speed="2">2x</span>
                                </div>
                            </div>

                            <button class="ctrl-btn" id="next-title-btn" title="Next Episode / Movie">
                                <i class="fa-solid fa-forward-step"></i>
                            </button>

                            <button class="ctrl-btn" id="fullscreen-btn" title="Toggle Fullscreen">
                                <i class="fa-solid fa-expand"></i>
                            </button>
                        </div>
                    </div>

                </div>

            </div>

        </div>

        <!-- MORE DETAILS BOTTOM PANEL -->
        <section class="watch-info-panel">
            <div class="info-panel-content">
                <h3 id="panel-movie-title">Movie Title</h3>
                <p id="panel-movie-desc">Movie description...</p>
                <div class="panel-meta">
                    <span>Cast: <strong id="panel-cast">...</strong></span>
                    <span>Genre: <strong id="panel-genre">...</strong></span>
                </div>
            </div>
        </section>

    </div>

    <!-- JAVASCRIPT -->
    <script src="../javascript/movies.js"></script>
    <script src="../javascript/watch.js"></script>

</body>

</html>
