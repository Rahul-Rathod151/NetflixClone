<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - Netflix</title>

    <link rel="icon" href="https://assets.nflxext.com/us/ffe/siteui/common/icons/nficon2016.ico">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="../css/notifications.css">
</head>

<body>

    <header class="notif-header">
        <a href="browse.html" class="netflix-logo" aria-label="Netflix Home">NETFLIX</a>
        <a href="browse.html" class="browse-link"><i class="fa-solid fa-arrow-left"></i> Browse</a>
    </header>

    <main class="notif-container">

        <div class="notif-page-heading">
            <div>
                <h1>Notifications</h1>
                <p>Stay updated with the latest releases, episode drops and account updates.</p>
            </div>
            <div class="notif-actions">
                <button id="mark-read-btn" class="btn-notif-action"><i class="fa-solid fa-check-double"></i> Mark all as read</button>
                <button id="clear-all-btn" class="btn-notif-action btn-danger"><i class="fa-solid fa-trash"></i> Clear all</button>
            </div>
        </div>

        <div class="notif-feed" id="notif-feed"></div>

        <div class="empty-notif-state" id="empty-notif-state" style="display: none;">
            <i class="fa-regular fa-bell-slash"></i>
            <h2>No notifications</h2>
            <p>You're all caught up! Check back later for new releases and recommendations.</p>
        </div>

    </main>

    <!-- JAVASCRIPT -->
    <script src="../javascript/movies.js"></script>
    <script src="../javascript/notifications.js"></script>

</body>

</html>
